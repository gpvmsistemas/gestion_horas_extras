# prefork MPM — afinado para RRHH (~500 cuentas, uso moderado)
# Servidor: 6 vCPU / 11 GiB RAM / PHP 8.4 (memory_limit 512M en Apache)
#
# Sustituye: /etc/apache2/mods-available/mpm_prefork.conf
#
# Antes: MaxRequestWorkers 150 / MaxConnectionsPerChild 0
# Ahora: techo 80 (sobra para uso moderado) y reciclado cada 2000 requests
# para limitar fugas de memoria en workers PHP.

<IfModule mpm_prefork_module>
	ServerLimit             80
	StartServers            4
	MinSpareServers         4
	MaxSpareServers         16
	MaxRequestWorkers       80
	MaxConnectionsPerChild  2000
</IfModule>
